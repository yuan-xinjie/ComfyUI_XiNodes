[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI_XiNodes"
version = "1.0.0"
description = "A custom node for ComfyUI."
authors = [
  { name="yuan-xinjie" }
]
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "Pillow",
    "av",
    "transnetv2-pytorch>=1.0.5; python_version >= '3.10'"
]

[project.urls]
"Homepage" = "https://github.com/yuan-xinjie/ComfyUI_XiNodes"
